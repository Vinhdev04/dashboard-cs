# ============================================================================
# NETLIFY DEPLOYMENT CONFIGURATION FOR VITE SINGLE PAGE APPLICATION (SPA)
# ============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA Routing: Redirect all routes to /index.html to prevent 404 on page refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
